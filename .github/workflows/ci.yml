name: CI
on:
  push:
  pull_request:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - name: Tests (SQLite) including the migration check
        run: python -m pytest -q

  backend-postgres:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      pg:
        image: postgres:16
        env: {POSTGRES_USER: flatwise, POSTGRES_PASSWORD: flatwise, POSTGRES_DB: flatwise_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U flatwise" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests (PostgreSQL 16)
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://flatwise:flatwise@127.0.0.1:5432/flatwise_test

  backend-mariadb:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: backend}}
    services:
      db:
        image: mariadb:10.6
        env: {MARIADB_ROOT_PASSWORD: flatwise, MARIADB_DATABASE: flatwise_test}
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Tests (MariaDB 10.6, the cPanel database)
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: mysql://root:flatwise@127.0.0.1:3306/flatwise_test

  frontend:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: frontend}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - name: i18n audit (keys in EN and BN, placeholders, hard-coded English, Latin digits and en-GB dates)
        run: npm run i18n:audit
      - uses: actions/cache@v4
        with:
          path: frontend/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/src/**') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-
      - run: npm run build
        env: {API_ORIGIN: "http://127.0.0.1:8000"}
